<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriAid Field Notes</title><link rel="icon" href="data:,">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--ink:#16222e;--mute:#667180;--line:#e0ddd4;--g:#2d6a1f;--gold:#d99a2b;--red:#b5432a;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101820;--card:#1a2631;--ink:#eef1f4;--mute:#9aa6b2;--line:#2c3a47;--g:#6fbf55;--gold:#e8b04a;--red:#e27a62;--on:#101820}}
:root[data-theme="dark"]{--bg:#101820;--card:#1a2631;--ink:#eef1f4;--mute:#9aa6b2;--line:#2c3a47;--g:#6fbf55;--gold:#e8b04a;--red:#e27a62;--on:#101820}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif;max-width:560px;margin:auto;padding:12px 14px 90px}
h1{font-size:20px;margin:6px 0 2px}h1 span{color:var(--g)}h2{font-size:17px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:8px 0 12px}.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-weight:600}
.tabs button.on{background:var(--g);color:var(--on);border-color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.q{margin:14px 0 6px;font-weight:600}.hint{color:var(--mute);font-size:13px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--ink);font-size:15px}
.chip.on{background:var(--g);color:var(--on);border-color:var(--g)}
.scale{display:flex;gap:6px}.scale .chip{flex:1;text-align:center;padding:12px 0;border-radius:10px}
.lbl{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:3px}
textarea,input[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.show{background:var(--bg);border-left:4px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;max-width:560px;margin:auto}
.btn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:16px}
.btn.p{background:var(--g);color:var(--on);border-color:var(--g)}.btn.r{color:var(--red)}
.bar{height:6px;background:var(--line);border-radius:4px;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--g);border-radius:4px}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.m{height:8px;background:var(--line);border-radius:5px;margin-top:3px}.m i{display:block;height:100%;background:var(--gold);border-radius:5px}
.quote{border-left:3px solid var(--g);padding:4px 10px;margin:8px 0;font-size:14px}
.sm{font-size:12px;color:var(--mute)}
</style></head><body>
<h1>Agri<span>Aid</span> Field Notes</h1>
<div class="sub">Sponsor a Pakistani Farmer's Insurance · 3-5 min street interview · students, not fundraisers</div>
<div class="tabs"><button id="t0" class="on">Interview</button><button id="t1">Results</button></div>
<div id="app"></div>
<div class="nav" id="nav"></div>
<script>
const STEPS=["Intro","Screening","Behaviour","Concept","Features","Commitment","Channel","Close"];
const sel=(k,o,multi)=>({k,o,multi});
let tab=0,step=0,d={},rows=[],mode="local",db=null;
let SYNC=(new URLSearchParams(location.search)).get("s")||(()=>{try{return localStorage.getItem("agriaid_sync")}catch(e){return ""}})()||"";
if(SYNC){try{localStorage.setItem("agriaid_sync",SYNC)}catch(e){}}
async function sync(){if(!SYNC||!navigator.onLine)return;let ch=false;
 for(const r of rows.filter(r=>!r.synced)){try{await fetch(SYNC,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(r)});r.synced=true;ch=true}catch(e){break}}
 if(ch){safeSet(LS,JSON.stringify(rows));if(tab==1)draw()}}
const emptyD=()=>({ts:Date.now()});
d=emptyD();
const LS="agriaid_fieldnotes_v1",NAME="agriaid_who";
const safeGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
rows=JSON.parse(safeGet(LS)||"[]");
function chips(k,opts,multi){return `<div class="chips">${opts.map(o=>{const on=multi?(d[k]||[]).includes(o):d[k]===o;return `<button class="chip ${on?'on':''}" data-k="${k}" data-v="${o}" data-m="${multi?1:0}">${o}</button>`}).join("")}</div>`}
function scale(k,a,b){return `<div class="scale">${[1,2,3,4,5].map(n=>`<button class="chip ${d[k]===n?'on':''}" data-k="${k}" data-v="${n}" data-n="1">${n}</button>`).join("")}</div><div class="lbl"><span>${a}</span><span>${b}</span></div>`}
const txt=(k,p)=>`<textarea rows="2" data-t="${k}" placeholder="${p}">${d[k]||""}</textarea>`;
const isBiz=()=>["Business owner / entrepreneur","Employed in a company"].includes(d.occ);
function body(){
switch(step){
case 0:return `<div class="card"><h2>Say this first</h2><div class="show">“Hi! We're IE students doing a university project on a charity that helps farmers in Pakistan. <b>We're not asking for money</b>. Do you have 3 minutes for a few questions? It's anonymous.”</div><div class="q">Interviewer</div><input type="text" id="who" value="${safeGet(NAME)||''}" placeholder="Your initials"><div class="q">Where are you?</div>${chips('loc',["Near campus","Café / coworking","Market / street","Office area","Park / other"])}<div class="sm" style="margin-top:12px">Ask first before any photo. Never note names or contacts.</div></div>`;
case 1:return `<div class="card"><h2>Screening</h2><div class="q">Age range</div>${chips('age',["18-24","25-34","35-49","50-64","65+"])}<div class="q">Which describes you best?</div>${chips('occ',["Student","Young professional","Employed in a company","Business owner / entrepreneur","Retired / other"])}<div class="q">Have you supported a cause in the last 12 months?<div class="hint">money, signing, volunteering, sharing</div></div>${chips('supp',["Yes","No"])}</div>`;
case 2:return `<div class="card"><h2>Behaviour</h2><div class="q">What did you do, most recently? <span class="hint">pick all</span></div>${chips('did',["One-off donation","Monthly donation","Sponsored a person / project","Event / auction","Volunteered","Signed / shared online","Nothing"],1)}<div class="q">I usually know what my donation actually achieved</div>${scale('know','Never','Always')}<div class="q">What makes you trust a charity? <span class="hint">why?</span></div>${txt('trust','Their words')}</div>`;
case 3:return `<div class="card"><h2>The concept</h2><div class="show">Show / read: <b>“You pay a Pakistani farmer's crop insurance. If a drought or flood destroys the harvest, the farmer is paid and can replant. Only 14% of Pakistani farmers have it.”</b></div><div class="q">In your own words, what would your money do?<div class="hint">tests whether it is clear</div></div>${chips('clear',["Got it","Partly","Confused"])}<div class="q">How appealing is this?</div>${scale('appeal','Not at all','Very')}<div class="q">Which would you rather fund?</div>${chips('prefer',["Insurance (protect before)","Disaster relief (help after)","Tools and seeds"])}<div class="q">Why? <span class="hint">one quote</span></div>${txt('quote','Direct quote, no names')}</div>`;
case 4:return `<div class="card"><h2>Features</h2><div class="show">Show the list: “Which two would make you most likely to sponsor?”</div>${chips('feat',["App alerts on payouts","Map + farmer's story","Regular video call with farmer","Yearly farm trip","Yearly donor evening","Annual impact report"],1)}<div class="q">Knowing my money reached a specific farmer matters</div>${scale('spec','Not at all','Essential')}<div class="q">Would you video-call or meet the farmer?</div>${chips('meet',["Yes","Maybe","No"])}<div class="q">Anything that would put you off?</div>${txt('off','Trust, distance, cost...')}</div>`;
case 5:return `<div class="card"><h2>Commitment</h2><div class="q">Would you sponsor a farmer?</div>${chips('signup',["Yes","Maybe","No"])}<div class="q">How would you prefer to pay?</div>${chips('form',["Yearly","Monthly","One-off","Split with others"])}<div class="q">Per year, what feels reasonable?</div>${chips('amt',["Under €25","€25-50","€50-100","€100-250","€250+"])}<div class="q">Would your company or a group co-sponsor?</div>${chips('group',["Yes","Maybe","No","N/A"])}<div class="q">Why / why not?</div>${txt('why','Barrier or motive')}</div>`;
case 6:return `<div class="card"><h2>Channel</h2><div class="q">Where would you expect to meet this? <span class="hint">pick all</span></div>${chips('chan',["Instagram","LinkedIn","Email","Street","Event","Friends / word of mouth","University"],1)}</div>`;
case 7:return `<div class="card"><h2>Close</h2><div class="q">Anything you would add?</div>${txt('extra','Open comment')}<div class="sm" style="margin-top:12px">Thank them, even if they said no.</div></div>`}}
function draw(){
 const nav=document.getElementById("nav"),app=document.getElementById("app");
 if(tab==1){nav.style.display="none";app.innerHTML=results();return}
 nav.style.display="flex";
 app.innerHTML=`<div class="bar"><i style="width:${(step+1)/STEPS.length*100}%"></i></div><div class="sm" style="margin-bottom:6px">${step+1}/${STEPS.length} · ${STEPS[step]} · ${rows.length} saved</div>`+body();
 nav.innerHTML=(step==0?`<button class="btn r" id="ref">Refused</button>`:`<button class="btn" id="bk">Back</button>`)+(step<STEPS.length-1?`<button class="btn p" id="nx">Next</button>`:`<button class="btn p" id="sv">Save</button>`);
 const w=document.getElementById("who");if(w)w.oninput=e=>{d.who=e.target.value;safeSet(NAME,d.who)};
 if(w&&!d.who)d.who=w.value;
 app.querySelectorAll("textarea").forEach(t=>t.oninput=e=>d[t.dataset.t]=e.target.value);
 app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const k=c.dataset.k,v=c.dataset.n?+c.dataset.v:c.dataset.v;
  if(c.dataset.m=="1"){const a=d[k]||[];d[k]=a.includes(v)?a.filter(x=>x!=v):[...a,v]}else d[k]=d[k]===v?undefined:v;
  const y=scrollY;draw();scrollTo(0,y)});
 const $=id=>document.getElementById(id);
 if($("nx"))$("nx").onclick=()=>{step++;draw();scrollTo(0,0)};
 if($("bk"))$("bk").onclick=()=>{step--;draw();scrollTo(0,0)};
 if($("sv"))$("sv").onclick=()=>save(false);
 if($("ref"))$("ref").onclick=()=>{const r=prompt("Refusal: why not interested? (optional)");if(r!==null){d.refused=true;d.why=r||"";save(true)}};
}
async function save(ref){
 const rec={...d,id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),refused:!!ref};
 rows.push(rec);safeSet(LS,JSON.stringify(rows));
 sync();
 d={ts:Date.now(),who:safeGet(NAME)||""};step=0;draw();scrollTo(0,0);
}
const pct=(n,t)=>t?Math.round(n/t*100)+"%":"-";
const cnt=(f)=>rows.filter(f).length;
function bars(k,opts,multi){const a=rows.filter(r=>!r.refused&&(multi?(r[k]||[]).length:r[k]));return opts.map(o=>{const n=a.filter(r=>multi?r[k].includes(o):r[k]===o).length;return `<div style="margin-top:8px"><div class="row" style="border:0;padding:0"><span>${o}</span><b>${n} · ${pct(n,a.length)}</b></div><div class="m"><i style="width:${a.length?n/a.length*100:0}%"></i></div></div>`}).join("")}
function avg(k){const a=rows.filter(r=>!r.refused&&typeof r[k]=="number");return a.length?(a.reduce((s,r)=>s+r[k],0)/a.length).toFixed(1):"-"}
function results(){
 const done=rows.filter(r=>!r.refused),ref=rows.length-done.length;
 const esc=q=>String(q).replace(/</g,'&lt;');
 const quotes=done.map(r=>r.quote||r.why).filter(Boolean).slice(-6);
 const barr=rows.filter(r=>(r.refused&&r.why)||r.off).map(r=>r.off||r.why).slice(-6);
 return `<div class="card"><h2>${done.length} interviews · ${ref} refusals</h2><div class="sm">${SYNC?`Synced to team sheet: ${rows.filter(r=>r.synced).length}/${rows.length}. Pending ones send when you are online.`:"No team sheet linked: saved on this phone only. Use Copy CSV."}<br>Team totals live in the Google Sheet.</div>
 <div class="row"><span>Concept clear ("Got it")</span><b>${pct(cnt(r=>r.clear=="Got it"),done.length)}</b></div>
 <div class="row"><span>Appeal (1-5)</span><b>${avg('appeal')}</b></div>
 <div class="row"><span>Would sponsor: Yes / Maybe</span><b>${pct(cnt(r=>r.signup=="Yes"),done.length)} / ${pct(cnt(r=>r.signup=="Maybe"),done.length)}</b></div>
 <div class="row"><span>Would meet / call farmer (Yes)</span><b>${pct(cnt(r=>r.meet=="Yes"),done.length)}</b></div>
 <div class="row"><span>Specific farmer matters (1-5)</span><b>${avg('spec')}</b></div>
 <div class="row"><span>Know what donations achieved (1-5)</span><b>${avg('know')}</b></div></div>
 <div class="card"><h2>Would rather fund</h2>${bars('prefer',["Insurance (protect before)","Disaster relief (help after)","Tools and seeds"])}</div>
 <div class="card"><h2>Top features (pick 2)</h2>${bars('feat',["App alerts on payouts","Map + farmer's story","Regular video call with farmer","Yearly farm trip","Yearly donor evening","Annual impact report"],1)}</div>
 <div class="card"><h2>Payment</h2>${bars('form',["Yearly","Monthly","One-off","Split with others"])}<h2 style="margin-top:14px">Per year</h2>${bars('amt',["Under €25","€25-50","€50-100","€100-250","€250+"])}</div>
 <div class="card"><h2>Quotes</h2>${quotes.map(q=>`<div class="quote">“${esc(q)}”</div>`).join("")||'<div class="sm">None yet</div>'}<h2 style="margin-top:12px">Barriers</h2>${barr.map(q=>`<div class="quote">${esc(q)}</div>`).join("")||'<div class="sm">None yet</div>'}</div>
 <button class="btn p" id="csv" style="width:100%;margin-bottom:8px">Copy CSV</button><button class="btn" id="dl" style="width:100%">Save CSV file</button>`}
function csv(){const keys=["ts","who","loc","age","occ","supp","did","know","trust","clear","appeal","prefer","quote","feat","spec","meet","off","signup","form","amt","group","why","chan","extra","refused"];
 const e=v=>'"'+String(Array.isArray(v)?v.join("; "):v??"").replace(/"/g,'""')+'"';
 return keys.join(",")+"\n"+rows.map(r=>keys.map(k=>e(k=="ts"?new Date(r.ts).toISOString():r[k])).join(",")).join("\n")}
document.addEventListener("click",async ev=>{
 if(ev.target.id=="csv"){try{await navigator.clipboard.writeText(csv());ev.target.textContent="Copied"}catch(e){prompt("Copy:",csv())}}
 if(ev.target.id=="dl"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv()],{type:"text/csv"}));a.download="agriaid-field-notes.csv";a.click()}
});
["t0","t1"].forEach((id,i)=>document.getElementById(id).onclick=()=>{tab=i;t0.classList.toggle("on",i==0);t1.classList.toggle("on",i==1);draw()});
draw();
sync();addEventListener("online",sync);
</script></body></html>
